# dsh-automation bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package: when
# the plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-automation@<version>
#
# the command reconciles `dsh.profile.bundles` against installed packages and,
# seeing this declaration, appends `dsh-automation` to the bundle stack. The
# profile boot then merges THIS patch (a single `insert` of the plugin row)
# like a manual cordis.patch.yml mount line.
#
# `name` must stay the full npm package name: the client-modules registry
# resolves the browser bundle by the loader entry name, so a shortened name
# leaves the client half silently out of window.__DSH_BOOT__.
#
# `inject` must stay aligned with src/index.ts: the loader reads the entry's
# options.inject, not the module's `export const inject`.
- insert:
    - id: dsh-automation
      name: dsh-automation
      inject: [tools, skills, webServer, webRuntime]
      config: {}
